
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Selector Saké</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; background: #fffdf7; margin: 0; }
    header { background: #ffe7db; padding: 1em; text-align: center; }
    h1 { font-size: 2.5em; margin: 0.3em 0; }
    .main-img { max-height: 180px; margin: 0.5em auto; display: block; }
    button {
      padding: 1em 2em; margin: 0.5em; background: darkorange; color: white;
      border: none; border-radius: 8px; font-size: 1em; cursor: pointer;
    }
    .card {
      background: white; padding: 1em; margin: 1em auto; max-width: 600px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1); cursor: pointer;
    }
    .product-detail {
      background: #fff; margin: 2em auto; max-width: 700px; padding: 1.5em;
      box-shadow: 0 0 15px rgba(0,0,0,0.2); text-align: center;
    }
    .product-detail img { max-height: 320px; margin-bottom: 1em; }
    footer { background: #a90000; text-align: center; padding: 1em; }
    footer img { max-height: 60px; }
    .badge { color: green; font-weight: bold; font-size: 1.1em; }
  </style>
</head>
<body>
  <header>
    <h1>Selector Saké</h1>
    <img class="main-img" src="visuel_sake.jpg" alt="Bouteille de saké" />
  </header>

  <main id="app">
    <div id="step"></div>
    <div id="results"></div>
    <div id="detail"></div>
  </main>

  <footer>
    <img src="logo_france_asia.jpg" alt="Logo France Asia" />
  </footer>

  <script>
    const sakes = Array.from({ length: 100 }, (_, i) => ({
      name: `Saké ${i + 1}`,
      type: "Junmai",
      region: "Japon",
      profile: ["Fruité", "Sec", "Doux"][i % 3],
      price: 15 + (i % 10) * 3,
      brewery: "Brasserie A",
      polish: 60,
      alcohol: 14.5,
      pairings: "Sushi, fruits de mer",
      gencod: "490000000" + (100 + i),
      beginner: i % 8 === 0,
      image: "visuel_sake.jpg"
    }));

    let filters = {};
    let step = 0;
    const steps = [
      { question: "1. Pour quelle occasion ?", key: "occasion", options: ["Apéritif", "Repas", "Dessert", "Cadeau"] },
      { question: "2. Quel style préférez-vous ?", key: "profile", options: ["Fruité", "Sec", "Doux"] },
      { question: "3. Température idéale ?", key: "temp", options: ["Très frais", "Frais", "Tempéré", "Chaud"] },
      { question: "4. Quel est votre budget ?", key: "budget", options: ["< 20 €", "20–40 €", "40 € et +"] }
    ];

    function renderStep() {
      document.getElementById("detail").innerHTML = "";
      const zone = document.getElementById("step");
      document.getElementById("results").innerHTML = "";
      if (step >= steps.length) return showResults();
      const s = steps[step];
      zone.innerHTML = `<h2>${s.question}</h2>` + s.options.map(opt =>
        `<button onclick='saveAnswer("${s.key}", "${opt}")'>${opt}</button>`).join('');
    }

    function saveAnswer(key, value) {
      filters[key] = value;
      step++;
      renderStep();
    }

    function showResults() {
      const r = document.getElementById("results");
      const s = document.getElementById("step");
      s.innerHTML = '<h2>Résultats :</h2><button onclick="reset()">Recommencer</button>';
      let result = sakes.filter(sk => !filters.profile || sk.profile === filters.profile);
      r.innerHTML = result.map(s =>
        `<div class="card" onclick='showDetail("${s.name}")'>
          <h3>${s.name}</h3>
          <p><strong>Type:</strong> ${s.type} — ${s.region}</p>
          <p><strong>Profil:</strong> ${s.profile}</p>
          <p><strong>Prix:</strong> ${s.price} €</p>
        </div>`).join('');
    }

    function showDetail(name) {
      const s = sakes.find(el => el.name === name);
      document.getElementById("detail").innerHTML = `
        <div class="product-detail">
          <img src="${s.image}" alt="Saké">
          <h2>${s.name}</h2>
          <p><strong>Type:</strong> ${s.type}</p>
          <p><strong>Brasserie:</strong> ${s.brewery}</p>
          <p><strong>Région:</strong> ${s.region}</p>
          <p><strong>Polissage:</strong> ${s.polish}%</p>
          <p><strong>Alcool:</strong> ${s.alcohol}%</p>
          <p><strong>Profil:</strong> ${s.profile}</p>
          <p><strong>Accords:</strong> ${s.pairings}</p>
          <p><strong>Prix:</strong> ${s.price} €</p>
          <p><strong>Code barre:</strong> ${s.gencod}</p>
          ${s.beginner ? '<p class="badge">🍶 Pour débuter</p>' : ''}
          <div><button onclick="closeDetail()">Fermer</button></div>
        </div>`;
    }

    function closeDetail() {
      document.getElementById("detail").innerHTML = "";
    }

    function reset() {
      step = 0;
      filters = {};
      document.getElementById("results").innerHTML = "";
      renderStep();
    }

    renderStep();
  </script>
</body>
</html>
